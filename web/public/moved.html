<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VerseOrchestrator</title>
    <link rel="icon" href="/icon.svg" />
    <!--
      After «Прибрати дані з цього браузера» (1.18.0-beta.1, DesktopSection.tsx → browserData.ts): a page
      with none of the app's code, so nothing writes the browser's storage back. The settings and
      the running order stay in data/ui-state.json — the desktop app takes them from there.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          15px/1.5 Inter,
          system-ui,
          sans-serif;
        background: #f3f3f1;
        color: #1e2025;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e2025;
          color: #e4e2dd;
        }
      }
      main {
        max-width: 34em;
        padding: 24px 16px;
      }
      p {
        margin: 0 0 10px;
      }
      .dim {
        opacity: 0.7;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        Дані застосунку з цього браузера прибрано. Вкладку можна закрити — застосунок працює у
        власному вікні.
      </p>
      <p class="dim">
        The app’s data is cleared from this browser. You can close this tab — the app runs in its
        own window.
      </p>
    </main>
  </body>
</html>
